networks:
  hound-net:
    driver: bridge

volumes:
  ollama-data:
  ravendb-data:
  grocery-data:

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - hound-net

  ollama-init:
    image: ollama/ollama
    container_name: ollama-init
    volumes:
      - ollama-data:/root/.ollama
      - ./infra/ollama/pull-models.sh:/pull-models.sh:ro
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      hound-api:
        condition: service_started
    restart: "no"
    networks:
      - hound-net

  ravendb:
    image: ravendb/ravendb
    container_name: ravendb
    ports:
      - "8080:8080"
    volumes:
      - ravendb-data:/opt/RavenDB/Server/RavenData
    environment:
      - RAVEN_Setup_Mode=None
      - RAVEN_License_Eula_Accepted=true
      - RAVEN_Security_UnsecuredAccessAllowed=PrivateNetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/studio/index.html"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - hound-net

  trading-pack:
    image: ghcr.io/mrcarlfarmer/hound-ai/trading-pack:latest
    container_name: trading-pack
    # Outbound hosts required by Market Intel services:
    #   data.alpaca.markets       — Alpaca news + bars
    #   news.google.com           — Google News RSS
    #   feeds.finance.yahoo.com   — Yahoo Finance RSS
    #   api.stocktwits.com        — StockTwits sentiment
    build:
      context: .
      dockerfile: src/Hound.Trading/Dockerfile
    env_file:
      - .env
    environment:
      - Ollama__BaseUrl=http://ollama:11434/v1
      - RavenDb__Url=http://ravendb:8080
    depends_on:
      ollama:
        condition: service_healthy
      ravendb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hound-net

  grocery-browser:
    image: ghcr.io/mrcarlfarmer/hound-ai/grocery-browser:latest
    container_name: grocery-browser
    # Python zendriver (undetected Chrome) sidecar driving Sainsbury's groceries.
    # Internal only — no host ports published. Reachable on hound-net as
    # http://grocery-browser:8090. Safety interlocks (URL denylist + action
    # allowlist) enforce hard rule R1: never select a slot, never check out / pay.
    build:
      context: .
      dockerfile: infra/grocery-browser/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - hound-net

  grocery-pack:
    image: ghcr.io/mrcarlfarmer/hound-ai/grocery-pack:latest
    container_name: grocery-pack
    # Grocery Pack (.NET): Concierge -> Planner -> Shopper -> Budget -> Learner.
    # Durable state is markdown on the git-ignored grocery-data volume.
    build:
      context: .
      dockerfile: src/Hound.Grocery/Dockerfile
    env_file:
      - .env
    environment:
      - Ollama__BaseUrl=http://ollama:11434/v1
      - RavenDb__Url=http://ravendb:8080
      - HoundApi__BaseUrl=http://hound-api:8080
      - BrowserWorker__BaseUrl=http://grocery-browser:8090
      - StateFiles__DataDirectory=/data/grocery
    volumes:
      - grocery-data:/data/grocery
    depends_on:
      ollama:
        condition: service_healthy
      ravendb:
        condition: service_healthy
      grocery-browser:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hound-net

  hound-api:
    image: ghcr.io/mrcarlfarmer/hound-ai/hound-api:latest
    container_name: hound-api
    build:
      context: .
      dockerfile: src/Hound.Api/Dockerfile
    ports:
      - "5000:8080"
    env_file:
      - .env
    environment:
      - RavenDb__Url=http://ravendb:8080
      - TradingPack__BaseUrl=http://trading-pack:8080
      - GroceryPack__BaseUrl=http://grocery-pack:8080
    depends_on:
      ravendb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hound-net

  hound-ui:
    image: ghcr.io/mrcarlfarmer/hound-ai/hound-ui:latest
    container_name: hound-ui
    build:
      context: ./ui/hound-dashboard
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - hound-api
    restart: unless-stopped
    networks:
      - hound-net
